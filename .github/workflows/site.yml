# =============================================================================
# Publication automatique du site
# -----------------------------------------------------------------------------
# À chaque modification de la branche « main », GitHub fabrique le site
# à partir du dossier docs/ et le met en ligne sur GitHub Pages.
# Vous n'avez rien à faire : il suffit de modifier les fichiers et d'enregistrer.
# =============================================================================

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de lancer la publication à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
